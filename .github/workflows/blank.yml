name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-core:
    name: Build engine + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FXEngineTestNo21/FXEngine.sln

      - name: Build
        run: dotnet build FXEngineTestNo21/FXEngine.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test FXEngineTestNo21/Tests/FXEngine.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: FXEngineTestNo21/Tests/TestResults/test-results.trx

  publish-xephyrefx-app:
    name: Publish XephyreFX.App (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained ${{ matrix.rid }} build
        run: >
          dotnet publish FXEngineTestNo21/Apps/XephyreFX.App/XephyreFX.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Upload raw build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XephyreFX-${{ matrix.rid }}-raw
          path: publish/${{ matrix.rid }}

      - name: Build Windows installer
        if: matrix.rid == 'win-x64'
        continue-on-error: true
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" FXEngineTestNo21\packaging\windows\xephyrefx.iss'

      - name: Upload Windows installer
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: XephyreFX-Setup-win-x64
          path: dist/XephyreFX-Setup.exe
          if-no-files-found: ignore

      - name: Build Linux install bundle
        if: matrix.rid == 'linux-x64'
        run: |
          mkdir -p dist/xephyrefx-linux-x64/app
          cp -r publish/linux-x64/* dist/xephyrefx-linux-x64/app/
          cp FXEngineTestNo21/packaging/linux/xephyrefx.desktop dist/xephyrefx-linux-x64/
          cp FXEngineTestNo21/packaging/linux/install.sh dist/xephyrefx-linux-x64/
          chmod +x dist/xephyrefx-linux-x64/install.sh dist/xephyrefx-linux-x64/app/XephyreFX
          tar -czf dist/XephyreFX-linux-x64.tar.gz -C dist xephyrefx-linux-x64

      - name: Upload Linux install bundle
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: XephyreFX-linux-x64
          path: dist/XephyreFX-linux-x64.tar.gz
